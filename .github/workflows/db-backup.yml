name: Daily Supabase DB Backup

on:
  schedule:
    # Se ejecuta todos los días a las 03:00 AM UTC
    - cron: '0 3 * * *'
  # Permite ejecutar el backup manualmente desde la pestaña Actions de GitHub
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          sudo sh -c 'echo "deb http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo apt-key add -
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17


      - name: Run pg_dump backup
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          mkdir -p backups
          pg_dump "$DB_URL" --clean --if-exists --no-owner --no-privileges > "backups/backup_${TIMESTAMP}.sql"
          gzip "backups/backup_${TIMESTAMP}.sql"
          echo "BACKUP_FILE=backups/backup_${TIMESTAMP}.sql.gz" >> $GITHUB_ENV

      - name: Upload Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supabase-db-backup-${{ github.run_number }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 30
